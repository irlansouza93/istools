# ISTools - Configuration file for plugin builder tool (pb_tool)
# Atualizado para v1.5.0 - Agora dentro da pasta istools/

[plugin]
name: istools
plugin_path:

[files]
# Arquivos Python (agora no mesmo nível deste .cfg)
python_files: __init__.py istools.py polygon_generator.py bounded_polygon_generator.py 
             extend_lines.py point_on_surface_generator.py intersection_line.py 
             clip_by_frame_logic.py converter_logic.py database_manager_logic.py 
             edgv_300_shp_to_postgis_logic.py load_shape_database_logic.py 
             postgis_to_shp_logic.py shp_to_postgis_logic.py resources.py

# Arquivos de interface (dynamic icons do gui/)
compiled_ui_files:

# Arquivo de recursos compiled
resource_files: resources.qrc

# Arquivos extras
extras: metadata.txt README.md README-ENG.md LICENSE LICENSE.txt icon.png

# Diretorios extras
extra_dirs: i18n icons translations processing gui data scripts help tests

# Idiomas
locales: pt_BR en

[help]
# Caminho do help consolidado
dir: help/build/html
target: help

[test]
# Diretorio de testes internos
dir: tests
